# Nginx Configuration Template for Construction Management Backend
# Copy this file to your VPS and customize it

# For Ubuntu/Debian: /etc/nginx/sites-available/construction-backend
# For CentOS/RHEL: /etc/nginx/conf.d/construction-backend.conf

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # Replace with your domain or IP address

    # Increase client body size for file uploads
    client_max_body_size 10M;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for large requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional, for monitoring)
    location /api/health {
        proxy_pass http://localhost:5000/api/health;
        access_log off;
    }
}

